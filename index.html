<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>しわけボード｜いいこと・ばあいによる・こまること</title>
<meta name="description" content="絵カードを「いいこと」と「こまること」の輪に置いて考えるWebアプリ。重なった部分は「ばあいによる」。場面タブでカードを切り替え、自分でカードも作れます。特別支援教育・SSTの無料教材です。">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@500;700;900&family=BIZ+UDPGothic:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F7F1E3; --card:#FFFDF6; --ink:#4A3F35; --ink-soft:#7C6E60; --line:#E4D9C4;
  --good:#7CC0A5; --good-d:#569B80;
  --bad:#6E93C4;  --bad-d:#4E71A2;
  --sun:#F2C46B; --sun-d:#CF9E45; --lilac:#C6A8D6; --lilac-d:#A183B4;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{
  font-family:'BIZ UDPGothic',system-ui,sans-serif;background:var(--bg);color:var(--ink);
  height:100dvh;display:flex;flex-direction:column;overflow:hidden;
  padding:calc(env(safe-area-inset-top) + 8px) calc(env(safe-area-inset-right) + 12px) calc(env(safe-area-inset-bottom) + 10px) calc(env(safe-area-inset-left) + 12px);
}
h1,h2,h3{font-family:'Zen Maru Gothic',sans-serif}

/* ---------- header ---------- */
.top{display:flex;align-items:baseline;gap:14px;flex:none;padding-bottom:8px}
.top h1{font-size:1.22rem;font-weight:900}
.top .sub{font-size:.76rem;color:var(--ink-soft)}
.top .sp{flex:1}
.btn{font-family:'Zen Maru Gothic',sans-serif;font-weight:700;border:none;border-radius:14px;cursor:pointer;
  background:var(--sun);color:#fff;padding:9px 16px;font-size:.92rem;box-shadow:0 4px 0 var(--sun-d);
  transition:transform .08s ease,box-shadow .08s ease;touch-action:manipulation;white-space:nowrap}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--sun-d)}
.btn:focus-visible{outline:4px solid #8FB8E8;outline-offset:3px}
.btn.lilac{background:var(--lilac);box-shadow:0 4px 0 var(--lilac-d)}
.btn.lilac:active{box-shadow:0 1px 0 var(--lilac-d)}
.btn.ghost{background:#fff;color:var(--ink-soft);box-shadow:0 3px 0 var(--line)}
.btn.ghost:active{box-shadow:0 1px 0 var(--line)}
.btn.sm{padding:7px 13px;font-size:.84rem}

/* ---------- board ---------- */
#board{flex:1 1 auto;position:relative;background:var(--card);border-radius:26px;
  box-shadow:0 5px 0 var(--line);overflow:hidden;min-height:280px}
#venn{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.blabel{position:absolute;display:flex;align-items:center;gap:9px;pointer-events:none;top:14px}
.blabel .t{font-family:'Zen Maru Gothic',sans-serif;font-weight:900;font-size:1.28rem;line-height:1.2}
.blabel .n{font-size:.74rem;color:var(--ink-soft);font-weight:400;font-family:'BIZ UDPGothic',sans-serif}
#lblGood{left:11%;top:15%}
#lblBad{right:11%;top:15%;flex-direction:row-reverse;text-align:right}
#lblGray{left:50%;transform:translateX(-50%);top:20%;flex-direction:column;gap:1px;text-align:center}
#lblGray .t{font-size:1rem;color:var(--ink-soft)}
#boardHint{position:absolute;left:50%;top:62%;transform:translateX(-50%);pointer-events:none;
  font-family:'Zen Maru Gothic',sans-serif;font-weight:700;color:var(--ink-soft);opacity:.55;font-size:1rem;text-align:center;line-height:1.7}

/* ---------- cards ---------- */
.chip{width:116px;background:#fff;border-radius:13px;box-shadow:0 3px 0 var(--line);overflow:hidden;
  cursor:grab;touch-action:none;border:none;padding:0;display:block;text-align:center}
.chip svg{width:100%;height:auto;display:block}
.chip .cap{font-family:'Zen Maru Gothic',sans-serif;font-weight:700;font-size:.7rem;padding:4px 4px 6px;line-height:1.35;color:var(--ink)}
.chip:focus-visible{outline:4px solid #8FB8E8;outline-offset:3px}
.chip.sel{box-shadow:0 0 0 4px var(--sun),0 3px 0 var(--sun-d)}
.chip.lift{opacity:.3}
.chip.txt{background:#FFF6E4;display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:92px}
.chip.txt .emo2{font-size:2.1rem;line-height:1.15;padding:10px 6px 2px;letter-spacing:2px}
.chip.txt .big{font-family:'Zen Maru Gothic',sans-serif;font-weight:700;font-size:.74rem;padding:3px 6px 9px;line-height:1.45}
.chip.onboard{position:absolute;transform:translate(-50%,-50%);cursor:grab;box-shadow:0 4px 10px rgba(74,63,53,.22)}
.chip.clone{position:fixed;z-index:999;pointer-events:none;transform:translate(-50%,-50%) rotate(-4deg);
  filter:drop-shadow(0 10px 14px rgba(0,0,0,.24));box-shadow:none}

/* ---------- tray ---------- */
#trayWrap{flex:none;height:30dvh;min-height:190px;max-height:300px;display:flex;flex-direction:column;
  background:var(--card);border-radius:26px;box-shadow:0 5px 0 var(--line);margin-top:10px;padding:10px 14px 12px}
.tabs{display:flex;align-items:center;gap:7px;flex:none;flex-wrap:wrap;padding-bottom:9px;border-bottom:2px dashed var(--line)}
.tab{border:3px solid var(--line);background:#fff;border-radius:999px;padding:7px 15px;font-size:.88rem;cursor:pointer;
  font-family:'Zen Maru Gothic',sans-serif;font-weight:700;color:var(--ink-soft)}
.tab[aria-pressed="true"]{border-color:var(--sun);background:#FFF6E4;color:var(--ink)}
.tab:focus-visible{outline:4px solid #8FB8E8;outline-offset:2px}
.tabs .sp{flex:1}
#tray{flex:1;overflow-y:auto;display:flex;flex-wrap:wrap;gap:9px;align-content:flex-start;padding-top:10px}
#tray:empty::after{content:'この ばめんの カードは ぜんぶ ボードに おきました';font-size:.85rem;color:var(--ink-soft);padding:6px 2px}
#trayWrap.over{outline:4px solid var(--sun);outline-offset:-2px}
.status{flex:none;font-size:.76rem;color:var(--ink-soft);padding-top:6px;min-height:1.2em}

/* ---------- add panel ---------- */
#addPanel{position:fixed;inset:0;background:rgba(74,63,53,.35);display:none;place-items:center;z-index:500;padding:16px}
#addPanel[open]{display:grid}
.sheet{background:var(--card);border-radius:24px;padding:18px 20px;width:min(560px,100%);max-height:86dvh;
  display:flex;flex-direction:column;box-shadow:0 18px 40px rgba(0,0,0,.25)}
.sheet h2{font-size:1.05rem;margin-bottom:3px}
.sheet .lead{font-size:.78rem;color:var(--ink-soft);margin-bottom:12px;line-height:1.6}
.emoRow{display:flex;gap:9px;align-items:center;flex-wrap:wrap;margin-bottom:10px}
.emoPrev{font-size:1.6rem;min-width:86px;height:50px;display:grid;place-items:center;background:#fff;
  border:3px solid var(--line);border-radius:14px;letter-spacing:2px}
.emoRow input[type=text]{font-family:'BIZ UDPGothic',sans-serif;font-size:.95rem;padding:11px 13px;border:3px solid var(--line);
  border-radius:14px;background:#fff;color:var(--ink);flex:1;min-width:170px}
.emoRow input[type=text]:focus{outline:none;border-color:var(--sun)}
.picker{background:#fff;border:3px solid var(--line);border-radius:14px;padding:8px 10px;overflow-y:auto;flex:1;min-height:120px}
.pgrp{font-size:.72rem;color:var(--ink-soft);margin:7px 0 4px}
.pgrid{display:flex;flex-wrap:wrap;gap:4px}
.emo{font-size:1.3rem;width:42px;height:42px;border:2px solid transparent;border-radius:11px;background:#FAF6EC;
  cursor:pointer;display:grid;place-items:center;padding:0;line-height:1}
.emo:hover{background:#FFF0D4}
.emo:focus-visible{outline:3px solid #8FB8E8;outline-offset:1px}
.sheetFoot{display:flex;gap:9px;align-items:center;flex-wrap:wrap;margin-top:12px}
.sheetFoot .sp{flex:1}
.saveline{display:flex;align-items:center;gap:8px;font-size:.78rem;color:var(--ink-soft)}
.saveline input{width:18px;height:18px;accent-color:var(--good)}
.mine{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.mineItem{display:inline-flex;align-items:center;gap:6px;background:#FFF6E4;border:2px solid var(--line);
  border-radius:999px;padding:5px 8px 5px 11px;font-size:.8rem}
.mineItem button{border:none;background:#C98A7A;color:#fff;width:20px;height:20px;border-radius:50%;
  cursor:pointer;font-size:.66rem;line-height:1;display:grid;place-items:center;padding:0}

@media(max-width:760px){
  .top h1{font-size:1.05rem}.top .sub{display:none}
  .blabel .t{font-size:1rem}.blabel .n{display:none}
  #lblGray .t{font-size:.82rem}
  .chip{width:96px}
  #trayWrap{height:34dvh}
}
@media print{
  body{height:auto;overflow:visible;background:#fff;padding:0;display:block}
  .noprint{display:none!important}
  #board{height:165mm;box-shadow:none;border:2px solid #bbb;border-radius:0;page-break-inside:avoid}
  @page{margin:10mm;size:landscape}
}
@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>

<div class="top">
  <h1>しわけボード</h1>
  <span class="sub noprint">カードを ボードに おいて かんがえよう</span>
  <span class="sp"></span>
  <button class="btn ghost sm noprint" type="button" id="resetBtn">ぜんぶ もどす</button>
  <button class="btn lilac sm noprint" type="button" id="printBtn">印刷</button>
</div>

<div id="board">
  <svg id="venn" viewBox="0 0 100 60" preserveAspectRatio="none" aria-hidden="true">
    <ellipse cx="32" cy="30" rx="32" ry="28.5" fill="#7CC0A5" fill-opacity="0.22" stroke="#7CC0A5" stroke-width="0.4"/>
    <ellipse cx="68" cy="30" rx="32" ry="28.5" fill="#6E93C4" fill-opacity="0.22" stroke="#6E93C4" stroke-width="0.4"/>
  </svg>
  <div class="blabel" id="lblGood"><span id="icAngel"></span><span><span class="t">いいこと</span><br><span class="n">やって いいね</span></span></div>
  <div class="blabel" id="lblGray"><span class="t">ばあいに よる</span><span class="n">どちらにも なる</span></div>
  <div class="blabel" id="lblBad"><span id="icDevil"></span><span><span class="t">こまること</span><br><span class="n">やめて おこう</span></span></div>
  <div id="boardHint">カードを ここに はこんでね<br>まんなかの かさなった ところにも おけます</div>
</div>

<div id="trayWrap">
  <div class="tabs" id="tabs"></div>
  <div id="tray"></div>
  <div class="status noprint" id="statusTxt"></div>
</div>

<div id="addPanel" role="dialog" aria-modal="true" aria-label="カードを ついかする">
  <div class="sheet">
    <h2>カードを ついかする</h2>
    <p class="lead">えもじを えらんで、ことばを いれてください。つくったカードは「じぶんの カード」タブに はいります。</p>
    <div class="emoRow">
      <span class="emoPrev" id="cardPrev" aria-live="polite"></span>
      <input type="text" id="ownText" maxlength="20" placeholder="カードの ことば（れい：ぼうしを かぶる）">
      <button class="btn ghost sm" type="button" id="cardClear">えらびなおす</button>
    </div>
    <div class="picker" id="cardPick"></div>
    <div class="mine" id="mineList"></div>
    <div class="sheetFoot">
      <label class="saveline"><input type="checkbox" id="optSave"> この端末に のこす</label>
      <span class="sp"></span>
      <button class="btn ghost" type="button" id="closeAdd">とじる</button>
      <button class="btn" type="button" id="addBtn">カードを つくる</button>
    </div>
  </div>
</div>

<script>
"use strict";
/* ============================================================
   イラストエンジン（すべて内蔵SVG／外部画像なし）
   ============================================================ */
const PAL = {
  skin : ['#FFE3CB','#F6C6A2'],
  skin2: ['#F4D2B0','#DCAE83'],
  hairA: ['#5E4835','#3A2C20'],
  hairB: ['#8E6A4A','#654A33'],
  hairC: ['#3E3A38','#23201F'],
  mint : ['#A9E4D2','#6FBFA8'],
  sun  : ['#FFD79A','#F2B463'],
  sky  : ['#B4D3F5','#7FA8DC'],
  rose : ['#FBBDBD','#EE9494'],
  plum : ['#DDBCE6','#BC94C9'],
  lemon: ['#FFEBA6','#F5D26B'],
  denim: ['#93AFD6','#6C8BB8'],
  moss : ['#BFD3A0','#96AF75'],
  clay : ['#E8BFA0','#C9997A']
};
const GRAD_IDS = Object.keys(PAL);

function defs(){
  let s = '<defs>';
  for(const k of GRAD_IDS){
    s += `<linearGradient id="g_${k}" x1="0" y1="0" x2="0.25" y2="1">`
      +  `<stop offset="0" stop-color="${PAL[k][0]}"/><stop offset="1" stop-color="${PAL[k][1]}"/></linearGradient>`;
  }
  s += '<linearGradient id="g_wall" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FFF7E8"/><stop offset="1" stop-color="#F6EBD6"/></linearGradient>';
  s += '<linearGradient id="g_floor" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#EBD9BC"/><stop offset="1" stop-color="#DCC5A2"/></linearGradient>';
  s += '<linearGradient id="g_sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#DCEFFB"/><stop offset="1" stop-color="#F2F7E9"/></linearGradient>';
  s += '<linearGradient id="g_road" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#C9C4BC"/><stop offset="1" stop-color="#AFA89E"/></linearGradient>';
  s += '</defs>';
  return s;
}
const G = k => `url(#g_${k})`;

/* ---- 背景 ---- */
const GROUND = 248;
function bgRoom(){
  return `<rect x="0" y="0" width="400" height="${GROUND}" fill="url(#g_wall)"/>`
       + `<rect x="0" y="${GROUND}" width="400" height="${290-GROUND}" fill="url(#g_floor)"/>`
       + `<rect x="0" y="${GROUND-3}" width="400" height="4" fill="#CBB48F" opacity=".5"/>`;
}
function bgOut(){
  return `<rect x="0" y="0" width="400" height="${GROUND}" fill="url(#g_sky)"/>`
       + `<circle cx="332" cy="44" r="24" fill="#FFE9A8"/>`
       + `<ellipse cx="70" cy="60" rx="42" ry="17" fill="#fff" opacity=".8"/>`
       + `<ellipse cx="98" cy="52" rx="28" ry="14" fill="#fff" opacity=".8"/>`
       + `<rect x="0" y="${GROUND}" width="400" height="${290-GROUND}" fill="#BFD3A0"/>`;
}
function shadow(x,y,w){ return `<ellipse cx="${x}" cy="${y}" rx="${w}" ry="${w*0.24}" fill="#7C6E60" opacity=".16"/>`; }

/* ---- 線 ---- */
function seg(p1,p2,col,w){
  return `<path d="M${p1[0]},${p1[1]} L${p2[0]},${p2[1]}" stroke="${col}" stroke-width="${w}" stroke-linecap="round" fill="none"/>`;
}

/* ---- かお ---- */
function face(expr){
  const E = '#4A3B30';
  let s = '';
  const blush = `<ellipse cx="-15.5" cy="-70" rx="5.5" ry="3.6" fill="#F5A3A3" opacity=".55"/>`
              + `<ellipse cx="15.5" cy="-70" rx="5.5" ry="3.6" fill="#F5A3A3" opacity=".55"/>`;
  const openEye = (x)=>`<ellipse cx="${x}" cy="-78" rx="3.1" ry="4.1" fill="${E}"/>`
                     + `<circle cx="${x+1.1}" cy="-79.6" r="1.15" fill="#fff"/>`;
  const arcEye  = (x,d)=>`<path d="M${x-4},${-78+(d?2:0)} Q${x},${-78+(d?-4:6)} ${x+4},${-78+(d?2:0)}" stroke="${E}" stroke-width="2.2" fill="none" stroke-linecap="round"/>`;
  switch(expr){
    case 'bigSmile':
      s += arcEye(-8,1)+arcEye(8,1)+blush;
      s += `<path d="M-8,-70 Q0,-60 8,-70 Z" fill="#C4645A"/>`;
      s += `<path d="M-5,-66.5 Q0,-63.5 5,-66.5 Z" fill="#F0908A"/>`;
      break;
    case 'smile':
      s += openEye(-8)+openEye(8)+blush;
      s += `<path d="M-6,-69.5 Q0,-63.5 6,-69.5" stroke="${E}" stroke-width="2.2" fill="none" stroke-linecap="round"/>`;
      break;
    case 'neutral':
      s += openEye(-8)+openEye(8)+blush;
      s += `<path d="M-5,-67.5 L5,-67.5" stroke="${E}" stroke-width="2.2" stroke-linecap="round"/>`;
      break;
    case 'sad':
      s += openEye(-8)+openEye(8)+blush;
      s += `<path d="M-12,-85 Q-8,-87.5 -4,-85.5" stroke="${E}" stroke-width="2" fill="none" stroke-linecap="round"/>`;
      s += `<path d="M12,-85 Q8,-87.5 4,-85.5" stroke="${E}" stroke-width="2" fill="none" stroke-linecap="round"/>`;
      s += `<path d="M-6,-65 Q0,-70.5 6,-65" stroke="${E}" stroke-width="2.2" fill="none" stroke-linecap="round"/>`;
      s += `<path d="M-11,-73 q-1.6,4 0,6 q1.6,-2 0,-6 z" fill="#8FC7E8"/>`;
      break;
    case 'surprise':
      s += `<circle cx="-8" cy="-78" r="4.2" fill="${E}"/><circle cx="-6.6" cy="-79.6" r="1.4" fill="#fff"/>`;
      s += `<circle cx="8" cy="-78" r="4.2" fill="${E}"/><circle cx="9.4" cy="-79.6" r="1.4" fill="#fff"/>`;
      s += blush + `<ellipse cx="0" cy="-66.5" rx="3.6" ry="4.4" fill="#C4645A"/>`;
      break;
    case 'shout':
      s += arcEye(-8,0)+arcEye(8,0);
      s += `<path d="M-13,-85.5 L-4,-83" stroke="${E}" stroke-width="2.2" stroke-linecap="round"/>`;
      s += `<path d="M13,-85.5 L4,-83" stroke="${E}" stroke-width="2.2" stroke-linecap="round"/>`;
      s += `<ellipse cx="0" cy="-66" rx="6" ry="7" fill="#C4645A"/>`;
      s += `<ellipse cx="0" cy="-63" rx="3.4" ry="2.6" fill="#F0908A"/>`;
      break;
    case 'pout':
      s += `<path d="M-12,-84 L-4,-81.5" stroke="${E}" stroke-width="2" stroke-linecap="round"/>`;
      s += `<path d="M12,-84 L4,-81.5" stroke="${E}" stroke-width="2" stroke-linecap="round"/>`;
      s += openEye(-8)+openEye(8)+blush;
      s += `<path d="M-5,-66.5 Q0,-70 5,-66.5" stroke="${E}" stroke-width="2.2" fill="none" stroke-linecap="round"/>`;
      break;
    case 'worry':
      s += `<path d="M-12,-86 Q-8,-88 -4,-86" stroke="${E}" stroke-width="2" fill="none" stroke-linecap="round"/>`;
      s += `<path d="M12,-86 Q8,-88 4,-86" stroke="${E}" stroke-width="2" fill="none" stroke-linecap="round"/>`;
      s += openEye(-8)+openEye(8)+blush;
      s += `<path d="M-5,-67 q2.5,-2.5 5,0 q2.5,2.5 5,0" transform="translate(-2.5,0)" stroke="${E}" stroke-width="2" fill="none" stroke-linecap="round"/>`;
      break;
    default:
      s += openEye(-8)+openEye(8)+blush;
      s += `<path d="M-6,-69.5 Q0,-63.5 6,-69.5" stroke="${E}" stroke-width="2.2" fill="none" stroke-linecap="round"/>`;
  }
  return s;
}

/* ---- かみがた ---- */
function hair(style,k){
  const c = G(k), d = PAL[k][1];
  const wrap = t => `<g transform="translate(0,-4)">${t}</g>`;
  switch(style){
    case 'bob':
      return wrap(`<path d="M-25,-76 q0,-27 25,-27 q25,0 25,27 q0,10 -2,16 l-7,0 q3,-12 -1,-18 q-8,5 -19,3 q-9,-1 -14,-5 q-3,7 -1,20 l-7,0 q-1,-8 1,-16 z" fill="${c}"/>`);
    case 'pony':
      return wrap(`<path d="M-25,-78 q0,-26 25,-26 q25,0 25,26 q0,4 -1,7 q-4,-13 -13,-15 q-9,6 -21,3 q-8,-1 -12,-5 q-2,4 -2,10 q-1,-1 -1,0 z" fill="${c}"/>`
           + `<path d="M22,-84 q14,-4 17,10 q3,14 -6,20 q-4,3 -6,-1 q-2,-4 2,-6 q5,-3 3,-11 q-2,-8 -10,-6 z" fill="${c}"/>`
           + `<ellipse cx="24" cy="-86" rx="5" ry="4" fill="#F5A3A3"/>`);
    case 'crop':
      return wrap(`<path d="M-25,-77 q0,-27 25,-27 q25,0 25,27 q0,4 -1,6 q-3,-11 -9,-14 q-6,7 -18,6 q-10,-1 -15,-6 q-5,4 -6,14 q-1,-3 -1,-6 z" fill="${c}"/>`);
    default: /* mush */
      return wrap(`<path d="M-26,-74 q-1,-30 26,-30 q27,0 26,30 q-4,-8 -13,-11 q-8,5 -19,4 q-11,-1 -17,-5 q-2,4 -3,12 z" fill="${c}"/>`
           + `<path d="M-26,-74 q6,3 13,3 q-2,-4 -1,-8 q-8,1 -12,5 z" fill="${d}" opacity=".5"/>`);
  }
}

/* ---- ポーズ ---- */
const POSES = {
  stand:{arms:[[[-16,-50],[-21,-38],[-22,-25]],[[16,-50],[21,-38],[22,-25]]],
         legs:[[[-8,-24],[-10,-13],[-11,-1]],[[8,-24],[10,-13],[11,-1]]]},
  walk :{arms:[[[-16,-50],[-23,-40],[-20,-28]],[[16,-50],[21,-40],[25,-30]]],

function kid(o){
  o = Object.assign({x:200,y:GROUND,s:1,skin:'skin',hair:'hairA',style:'mush',
                     shirt:'mint',pants:'denim',pose:'stand',expr:'smile',flip:false,shoe:'#6B5B4B'},o);
  const P = POSES[o.pose] || POSES.stand;
  const drop = P.drop || 0;
  const lean = P.lean || 0;
  const skinC = G(o.skin), shirtC = G(o.shirt), pantsC = G(o.pants);
  let s = '';

  // legs (behind)
  for(const L of P.legs){
    s += seg(L[0],L[1],pantsC,13.5);
    s += seg(L[1],L[2],skinC,9);
    s += `<ellipse cx="${L[2][0]}" cy="${L[2][1]+0.5}" rx="8.5" ry="5" fill="${o.shoe}"/>`;
  }
  // torso + arms + head
  let body = '';
  body += `<path d="M-17,-52 q0,-6 6,-6 h22 q6,0 6,6 v22 q0,8 -8,8 h-18 q-8,0 -8,-8 z" fill="${shirtC}"/>`;
  body += `<path d="M-17,-38 q17,6 34,0 v6 q-17,6 -34,0 z" fill="#000" opacity=".05"/>`;
  for(const A of P.arms){
    body += seg(A[0],A[1],shirtC,12.5);
    body += seg(A[1],A[2],skinC,8.5);
    body += `<circle cx="${A[2][0]}" cy="${A[2][1]}" r="5.2" fill="${skinC}"/>`;
  }
  body += `<rect x="-5" y="-60" width="10" height="9" rx="4" fill="${skinC}"/>`;
  body += `<ellipse cx="0" cy="-76" rx="23.5" ry="24.5" fill="${skinC}"/>`;
  body += `<ellipse cx="-5" cy="-84" rx="12" ry="8" fill="#fff" opacity=".18"/>`;
  body += hair(o.style,o.hair);
  body += face(o.expr);

  s += `<g transform="translate(0,${drop}) rotate(${lean},0,-24)">${body}</g>`;

  const flip = o.flip ? ' scale(-1,1)' : '';
  return `<g transform="translate(${o.x},${o.y}) scale(${o.s})${flip}">${s}</g>`;
}

    + kid({x:44,y:88,s:0.78,shirt:'mint',hair:'hairB',style:'bob',expr:'worry'})
    + `<text x="80" y="34" font-family="Zen Maru Gothic, sans-serif" font-weight="900" font-size="34" fill="#B9AC97" text-anchor="middle">?</text></svg>`;
}

/* ============================================================
   しわけボード：アプリ本体
   ============================================================ */
const $ = id => document.getElementById(id);
const esc = s => String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

const TABS = [
  {id:'act',    label:'こうどう'},
  {id:'food',   label:'たべる・みのまわり'},
  {id:'class',  label:'きょうしつ'},
  {id:'friend', label:'ともだち'},
  {id:'safety', label:'そとで あんぜんに'},
  {id:'mine',   label:'じぶんの カード'}
];
const EMOJI = [
  {g:'ばしょ・じかん', list:['🏫','🚪','🪑','🚻','🏠','🛏️','🍽️','🏞️','⛲','🛝','🚌','🚗','🛣️','🏪','🏥','☀️','☔','🌙','🔔','🕐']},
  {g:'がくしゅう・せいかつ', list:['✏️','📚','📖','🖍️','✂️','📐','🎒','🎵','🎨','🧹','🗑️','💧','🧼','🪥','🍚','🥛','🍎','🥢','🧺','👕']},
  {g:'きもち・あいさつ', list:['😀','🙂','😐','😢','😡','😮','😴','🤔','🙋','🙅','🙆','🤫','👋','🤝','👍','👎','❤️','💦','🗣️','👂']},
  {g:'うごき・あそび', list:['🏃','🚶','🧍','💤','🍴','🎮','📱','⚽','⚾','🪁','🤾','🧗','✋','🔊','⚠️','❗','⭕','❌']}
];
const SKEY = 'tkk-shiwake-v2';
const S = { tab:'act', items:[], uid:0, sel:null, custom:[], emo:'' };

/* ---- カードを つくる（起動時に1回だけ） ---- */
function addItem(o){
  const it = Object.assign({uid:'c'+(S.uid++), on:false, x:50, y:50, svg:null, emoji:null, cap:''}, o);
  S.items.push(it);
  return it;
}
function buildItems(){
  ACTS.forEach(a=> addItem({tab:'act', cap:a.cap, svg:a.svg}));
  PAIRS.forEach(p=>{
    addItem({tab:p.cat, cap:p.g.cap, svg:p.g.svg});
    addItem({tab:p.cat, cap:p.b.cap, svg:p.b.svg});
  });
  S.custom.forEach(c=> addItem({tab:'mine', cap:c.text, emoji:c.emoji}));
}

/* ---- チップ ---- */
const cache = {};
function chipEl(it){
  if(cache[it.uid]) return cache[it.uid];
  const b=document.createElement('button');
  b.type='button'; b.className='chip'+(it.svg?'':' txt');
  b.dataset.uid=it.uid;
  b.innerHTML = it.svg ? (it.svg() + `<div class="cap">${esc(it.cap)}</div>`)
                       : `${it.emoji?`<div class="emo2">${esc(it.emoji)}</div>`:''}${it.cap?`<div class="big">${esc(it.cap)}</div>`:''}`;
  b.setAttribute('aria-label',(it.emoji||'')+' '+(it.cap||''));
  b.addEventListener('pointerdown', e=>onDown(e,it,b));
  b.addEventListener('click', e=>{ if(e.detail===0){ S.sel=(S.sel===it.uid)?null:it.uid; render(); } });
  cache[it.uid]=b;
  return b;
}
function render(){
  const board=$('board'), tray=$('tray');
  const onItems  = S.items.filter(i=>i.on);
  const trayItems= S.items.filter(i=>i.tab===S.tab && !i.on);

  Array.from(board.querySelectorAll('.chip')).forEach(c=>{
    if(!onItems.some(i=>cache[i.uid]===c)) c.remove();
  });
  onItems.forEach(it=>{
    const el=chipEl(it);
    if(el.parentNode!==board) board.appendChild(el);
    el.classList.add('onboard');
    el.style.left=it.x+'%'; el.style.top=it.y+'%';
  });

  Array.from(tray.querySelectorAll('.chip')).forEach(c=>{
    if(!trayItems.some(i=>cache[i.uid]===c)) c.remove();
  });
  trayItems.forEach(it=>{
    const el=chipEl(it);
    el.classList.remove('onboard'); el.style.left=''; el.style.top='';
    if(el.parentNode!==tray) tray.appendChild(el);
  });

  S.items.forEach(it=>{ if(cache[it.uid]) cache[it.uid].classList.toggle('sel', S.sel===it.uid); });
  $('boardHint').style.display = onItems.length ? 'none' : '';
  $('statusTxt').textContent = S.sel ? 'カードを えらびました。ボードの おきたい ところを クリックしてね。' : '';
}
function toBoard(it, clientX, clientY){
  const r=$('board').getBoundingClientRect();
  const el=chipEl(it);
  const cw=(el.offsetWidth||116)/2, ch=(el.offsetHeight||110)/2;
  const px=Math.min(Math.max(clientX-r.left, cw+4), r.width-cw-4);
  const py=Math.min(Math.max(clientY-r.top,  ch+4), r.height-ch-4);
  it.on=true; it.x=+(px/r.width*100).toFixed(2); it.y=+(py/r.height*100).toFixed(2);
  S.sel=null; render();
}
function toTray(it){ it.on=false; S.sel=null; render(); }

/* ---- ドラッグ／タップ ---- */
let drag=null;
function inRect(el,x,y){ const r=el.getBoundingClientRect(); return x>=r.left&&x<=r.right&&y>=r.top&&y<=r.bottom; }
function onDown(e,it,el){
  if(e.button!==undefined && e.button>0) return;
  drag={it,el,x0:e.clientX,y0:e.clientY,moved:false,clone:null,id:e.pointerId};
  try{ el.setPointerCapture(e.pointerId); }catch(err){}
}
function onMove(e){
  if(!drag || e.pointerId!==drag.id) return;
  if(!drag.moved && Math.hypot(e.clientX-drag.x0, e.clientY-drag.y0)<9) return;
  if(!drag.moved){
    drag.moved=true;
    const c=drag.el.cloneNode(true);
    c.className='chip clone'+(drag.el.classList.contains('txt')?' txt':'');
    c.style.width=(drag.el.offsetWidth||116)+'px';
    document.body.appendChild(c); drag.clone=c; drag.el.classList.add('lift');
  }
  drag.clone.style.left=e.clientX+'px'; drag.clone.style.top=e.clientY+'px';
  $('trayWrap').classList.toggle('over', inRect($('trayWrap'),e.clientX,e.clientY));
  e.preventDefault();
}
function endDrag(){ if(drag){ if(drag.clone) drag.clone.remove(); drag.el.classList.remove('lift'); drag=null; } $('trayWrap').classList.remove('over'); }
function onUp(e){
  if(!drag || e.pointerId!==drag.id) return;
  const d=drag, moved=drag.moved; endDrag();
  if(moved){
    if(inRect($('board'),e.clientX,e.clientY)) toBoard(d.it,e.clientX,e.clientY);
    else if(inRect($('trayWrap'),e.clientX,e.clientY)) toTray(d.it);
    else render();
  }else{
    S.sel=(S.sel===d.it.uid)?null:d.it.uid; render();
  }
}
document.addEventListener('pointermove',onMove,{passive:false});
document.addEventListener('pointerup',onUp);
document.addEventListener('pointercancel',()=>{ endDrag(); render(); });

$('board').addEventListener('click',e=>{
  if(e.target.closest('.chip')) return;
  if(!S.sel) return;
  const it=S.items.find(i=>i.uid===S.sel);
  if(it) toBoard(it,e.clientX,e.clientY);
});
$('trayWrap').addEventListener('click',e=>{
  if(e.target.closest('.chip')||e.target.closest('.tab')||e.target.closest('button')) return;
  if(!S.sel) return;
  const it=S.items.find(i=>i.uid===S.sel);
  if(it) toTray(it);
});

/* ---- タブ ---- */
function drawTabs(){
  const box=$('tabs'); box.innerHTML='';
  TABS.forEach(t=>{
    const b=document.createElement('button');
    b.type='button'; b.className='tab'; b.dataset.tab=t.id; b.textContent=t.label;
    b.setAttribute('aria-pressed', t.id===S.tab?'true':'false');
    b.addEventListener('click',()=>{ S.tab=t.id; drawTabs(); render(); });
    box.appendChild(b);
  });
  const sp=document.createElement('span'); sp.className='sp'; box.appendChild(sp);
  const add=document.createElement('button');
  add.type='button'; add.className='btn sm noprint'; add.id='openAdd'; add.textContent='＋ カードを ついかする';
  add.addEventListener('click',openAdd);
  box.appendChild(add);
}

/* ---- カードを ついかする ---- */
function buildPicker(){
  const box=$('cardPick'); box.innerHTML='';
  EMOJI.forEach(g=>{
    const h=document.createElement('div'); h.className='pgrp'; h.textContent=g.g; box.appendChild(h);
    const grid=document.createElement('div'); grid.className='pgrid';
    g.list.forEach(e=>{
      const b=document.createElement('button');
      b.type='button'; b.className='emo'; b.textContent=e; b.setAttribute('aria-label',e);
      b.addEventListener('click',()=>{ if(emoLen(S.emo)<3){ S.emo+=e; $('cardPrev').textContent=S.emo; } });
      grid.appendChild(b);
    });
    box.appendChild(grid);
  });
}
function emoLen(s){ return Array.from(s.replace(/\uFE0F/g,'')).length; }
function drawMine(){
  const box=$('mineList'); box.innerHTML='';
  S.items.filter(i=>i.tab==='mine').forEach(it=>{
    const d=document.createElement('span'); d.className='mineItem';
    d.textContent=(it.emoji||'')+' '+(it.cap||'');
    const x=document.createElement('button');
    x.type='button'; x.textContent='✕'; x.setAttribute('aria-label',(it.cap||'カード')+' を けす');
    x.addEventListener('click',()=>delMine(it.uid));
    d.appendChild(x); box.appendChild(d);
  });
}
function delMine(uid){
  const it=S.items.find(i=>i.uid===uid); if(!it) return;
  if(cache[uid]){ cache[uid].remove(); delete cache[uid]; }
  S.items=S.items.filter(i=>i.uid!==uid);
  S.custom=S.items.filter(i=>i.tab==='mine').map(i=>({emoji:i.emoji||'',text:i.cap||''}));
  drawMine(); render(); save();
}
function openAdd(){ $('addPanel').setAttribute('open',''); $('ownText').focus(); }
function closeAdd(){ $('addPanel').removeAttribute('open'); }
$('closeAdd').addEventListener('click',closeAdd);
$('addPanel').addEventListener('click',e=>{ if(e.target===$('addPanel')) closeAdd(); });
document.addEventListener('keydown',e=>{ if(e.key==='Escape' && $('addPanel').hasAttribute('open')) closeAdd(); });
$('cardClear').addEventListener('click',()=>{ S.emo=''; $('cardPrev').textContent=''; });
$('addBtn').addEventListener('click',()=>{
  const t=$('ownText').value.trim();
  if(!t && !S.emo){ $('ownText').focus(); return; }
  addItem({tab:'mine', cap:t, emoji:S.emo});
  S.custom=S.items.filter(i=>i.tab==='mine').map(i=>({emoji:i.emoji||'',text:i.cap||''}));
  $('ownText').value=''; S.emo=''; $('cardPrev').textContent='';
  S.tab='mine'; drawTabs(); drawMine(); render(); save();
});
$('ownText').addEventListener('keydown',e=>{ if(e.key==='Enter'){ e.preventDefault(); $('addBtn').click(); } });

$('resetBtn').addEventListener('click',()=>{ S.items.forEach(i=>i.on=false); S.sel=null; render(); });
$('printBtn').addEventListener('click',()=>{ setTimeout(()=>window.print(),60); });

/* ---- ほぞん（チェックしたときだけ） ---- */
function save(){
  if(!$('optSave').checked) return;
  try{ localStorage.setItem(SKEY, JSON.stringify({cards:S.custom})); }catch(e){}
}
function load(){
  try{
    const raw=localStorage.getItem(SKEY); if(!raw) return false;
    const o=JSON.parse(raw);
    S.custom = Array.isArray(o.cards)?o.cards.filter(c=>c&&(c.text||c.emoji)).map(c=>({emoji:c.emoji||'',text:c.text||''})):[];
    return true;
  }catch(e){ return false; }
}
$('optSave').addEventListener('change',()=>{
  if($('optSave').checked) save();
  else { try{ localStorage.removeItem(SKEY); }catch(e){} }
});

/* ---- 起動 ---- */
$('icAngel').innerHTML = figAngel(50);
$('icDevil').innerHTML = figDevil(50);
if(load()) $('optSave').checked = true;
buildItems(); buildPicker(); drawTabs(); drawMine(); render();
</script>
</body>
